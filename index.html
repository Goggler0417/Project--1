<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tagmark Local v1</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#697386;--line:#e5e9f0;
  --accent:#2563eb;--danger:#dc2626;--chip:#eef2ff;
  --include:#dcfce7;--exclude:#fee2e2;
  --include-text:#166534;--exclude-text:#991b1b;
  --cat:#fef3c7;--cat-text:#92400e;
  --male:#2563eb;--female:#dc2626;--tagprefix:#111827;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:env(safe-area-inset-top) 16px 30px}
header{padding:22px 4px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:25px;font-weight:800}.sub{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px}

.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 18px;border:0;background:transparent;border-radius:10px 10px 0 0;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--panel);margin-bottom:-1px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px #00000008}
.side-panel{padding:16px}
.side-title{font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.side-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;outline:none}

.searchbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:160px;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}
.select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}

.stats{padding:10px 14px;color:var(--muted);font-size:13px}
.cards{padding:0 12px 12px;display:grid;gap:9px}
.card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
.card-title{font-weight:700;overflow-wrap:anywhere}
.url-row{margin:4px 0 9px}
.url{color:var(--accent);font-size:13px;overflow-wrap:anywhere;margin-top:6px}
.url.hidden{display:none!important}
.notes{font-size:13px;color:#4b5563;margin:7px 0;white-space:pre-wrap}
.meta{font-size:12px;color:var(--muted);margin:4px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:4px 8px;font-size:12px}
.chip.cat{background:var(--cat);color:var(--cat-text)}
.chip.male,.tag-btn.male{color:var(--male)!important}
.chip.female,.tag-btn.female{color:var(--female)!important}
.chip.tagprefix,.tag-btn.tagprefix{color:var(--tagprefix)!important}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{padding:7px 9px;font-size:12px}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}

.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag-btn{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;
}
.tag-btn:hover{background:var(--chip)}
.tag-btn.include{background:var(--include);border-color:#86efac;color:var(--include-text)}
.tag-btn.exclude{background:var(--exclude);border-color:#fca5a5;color:var(--exclude-text)}
.tag-btn .cnt{font-size:11px;opacity:.7}
.tag-legend{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.tag-manage{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.tag-manage input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.tag-manage .row{display:flex;gap:8px}
.reg-tag-row{display:flex;align-items:center;gap:6px;padding:4px 0}

.cat-tree{display:flex;flex-direction:column;gap:2px}
.cat-node{display:flex;align-items:center;gap:4px;border-radius:8px;padding:4px 6px}
.cat-node:hover{background:#f8fafc}
.cat-node.active{background:var(--cat)}
.cat-toggle{width:22px;height:22px;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0;flex-shrink:0}
.cat-toggle.invisible{visibility:hidden}
.cat-label{flex:1;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer}
.cat-label:hover{background:rgba(0,0,0,.04)}
.cat-cnt{font-size:11px;color:var(--muted);margin-right:4px}
.cat-actions{display:flex;gap:2px;opacity:1}
.cat-actions button{border:0;background:transparent;padding:4px 6px;font-size:12px;color:var(--muted);border-radius:4px}
.cat-actions button:hover{background:var(--line);color:var(--text)}
.cat-children{margin-left:18px;border-left:1px solid var(--line);padding-left:4px}
.cat-manage{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.cat-manage input,.cat-manage select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.cat-manage .row{display:flex;gap:8px}
.cat-filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cat-filter-bar label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}

.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:17px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:18px}
.dialog h2{margin:0 0 14px}
.field{margin:11px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}
.field textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hidden{display:none!important}
.importbox{border:1px dashed #b9c2d0;padding:15px;border-radius:12px;background:#fafbfe}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

.tag-picker,.cat-picker{position:relative}
.tag-picker-input,.cat-picker-input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}
.tag-suggest,.cat-suggest{
  position:absolute;left:0;right:0;top:100%;z-index:5;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  max-height:220px;overflow:auto;box-shadow:0 8px 20px #0001;display:none;
}
.tag-suggest.open,.cat-suggest.open{display:block}
.tag-suggest div,.cat-suggest div{padding:9px 12px;cursor:pointer;font-size:13px}
.tag-suggest div:hover{background:var(--chip)}
.cat-suggest div:hover{background:var(--cat)}
.selected-tags,.selected-cat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.selected-tags .chip,.selected-cat .chip{
  padding:5px 10px;border-radius:999px;font-size:12px;
  display:inline-flex;align-items:center;gap:4px;
}
.selected-cat .chip{background:var(--cat);color:var(--cat-text)}
.selected-tags .chip button,.selected-cat .chip button{
  border:0;background:transparent;padding:0 2px;font-size:14px;line-height:1;color:var(--muted);
}

@media(max-width:760px){
  .app{padding-left:10px;padding-right:10px}
  .toolbar{width:100%}.toolbar .btn{flex:1}
  .searchbar{padding:9px}.card{padding:12px}
  .cat-actions{opacity:1}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="logo">Tagmark</div>
    <div class="sub">Local v1</div>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="addBtn">＋ 북마크</button>
    <button class="btn" id="importBtn">가져오기</button>
    <button class="btn" id="exportBtn">백업</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="search">검색</button>
  <button class="tab" data-tab="tags">Tag</button>
  <button class="tab" data-tab="categories">Category</button>
</div>

<div id="tab-search" class="panel">
  <div class="searchbar">
    <input class="search" id="search" placeholder="">
    <select class="select" id="searchScope">
      <option value="all">전체</option>
      <option value="title">제목</option>
      <option value="tag">태그</option>
      <option value="category">카테고리</option>
    </select>
    <select class="select" id="sort">
      <option value="updated">최근 수정</option>
      <option value="title">제목</option>
      <option value="domain">도메인</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cards" id="cards"></div>
</div>

<div id="tab-tags" class="panel side-panel hidden">
  <div class="side-title">
    <span>태그 필터</span>
    <button class="btn sm" id="clearTagFilters">필터 초기화</button>
  </div>
  <input class="side-search" id="tagFilterSearch" placeholder="">
  <div class="tag-grid" id="tagGrid"></div>
  <div class="tag-legend">
    <strong>클릭 방식</strong><br>
    1회 → <span style="color:var(--include-text)">포함</span><br>
    2회 → <span style="color:var(--exclude-text)">제외</span><br>
    3회 → 해제
  </div>
  <div class="tag-manage">
    <div class="side-title" style="margin-bottom:8px">사전 등록 태그</div>
    <input id="newTagName" placeholder="">
    <div class="row">
      <button class="btn primary" id="addRegisteredTag" style="flex:1">등록</button>
    </div>
    <div id="registeredTagList" style="margin-top:12px"></div>
  </div>
</div>

<div id="tab-categories" class="panel side-panel hidden">
  <div class="side-title">
    <span>카테고리</span>
    <button class="btn sm" id="clearCatFilter">필터 초기화</button>
  </div>
  <div class="cat-filter-bar">
    <label><input type="checkbox" id="includeDescendants" checked> 하위 카테고리 포함</label>
  </div>
  <input class="side-search" id="catFilterSearch" placeholder="">
  <div class="cat-tree" id="catTree"></div>
  <div class="cat-manage">
    <div class="side-title" style="margin-bottom:8px">카테고리 추가</div>
    <input id="newCatName" placeholder="">
    <select id="newCatParent"><option value="">(최상위)</option></select>
    <div class="row">
      <button class="btn primary" id="addCategory" style="flex:1">추가</button>
    </div>
  </div>
</div>
</div>

<div class="modal" id="editModal">
  <div class="dialog">
    <h2 id="modalTitle">북마크 추가</h2>
    <div class="field"><label>URL</label><input id="url" type="url" placeholder=""></div>
    <div class="field"><label>제목</label><input id="title" placeholder=""></div>
    <div class="field">
      <label>카테고리</label>
      <div class="cat-picker">
        <input class="cat-picker-input" id="catPickerInput" placeholder="" autocomplete="off">
        <div class="cat-suggest" id="catSuggest"></div>
      </div>
      <div class="selected-cat" id="selectedCat"></div>
    </div>
    <div class="field">
      <label>태그</label>
      <div class="tag-picker">
        <input class="tag-picker-input" id="tagPickerInput" placeholder="" autocomplete="off">
        <div class="tag-suggest" id="tagSuggest"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>
    </div>
    <div class="field">
      <label>페이지 수 / 재생시간</label>
      <select id="metaType">
        <option value="">선택 안 함</option>
        <option value="pages">페이지 수</option>
        <option value="duration">재생시간</option>
      </select>
    </div>
    <div class="field hidden" id="metaPagesField">
      <label>페이지 수</label>
      <input id="metaPages" type="number" min="1" step="1" placeholder="">
    </div>
    <div class="field hidden" id="metaDurationField">
      <label>재생시간</label>
      <div style="display:flex;align-items:center;gap:6px">
        <input id="durH" type="number" min="0" max="99" step="1" value="0" style="width:4.5em;text-align:center">
        <span>:</span>
        <input id="durM" type="number" min="0" max="59" step="1" value="0" style="width:4.5em;text-align:center">
        <span>:</span>
        <input id="durS" type="number" min="0" max="59" step="1" value="0" style="width:4.5em;text-align:center">
      </div>
    </div>
    <div class="field"><label>메모</label><textarea id="notes" placeholder=""></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="dialog">
    <h2>북마크 가져오기</h2>
    <div class="importbox">
      <input id="fileInput" type="file" accept=".json,.txt,.html,.htm">
      <p class="hint">JSON 백업, 텍스트, Chrome 북마크 HTML 지원. HTML 폴더는 카테고리 계층으로 변환됩니다.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="importCancel">닫기</button></div>
  </div>
</div>

<script>
const DB_NAME = "tagmark-local-v1";
const STORE_BOOKMARKS = "bookmarks";
const STORE_TAGS = "registeredTags";
const STORE_CATS = "categories";

let db;
let items = [];
let registeredTags = [];
let categories = [];
let tagStates = {};
let selectedCatId = null;
let includeDescendants = true;
let expandedCats = new Set();
let editingId = null;
let currentSelectedTags = [];
let currentCategoryId = null;

const $ = id => document.getElementById(id);

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);
}

function normalizeUrl(u) {
  try {
    let x = new URL(u.trim());
    x.protocol = x.protocol.toLowerCase();
    x.hostname = x.hostname.toLowerCase();
    if ((x.protocol === "https:" && x.port === "443") || (x.protocol === "http:" && x.port === "80")) x.port = "";
    x.hash = "";
    if (x.pathname.length > 1) x.pathname = x.pathname.replace(/\/+$/, "");
    return x.toString();
  } catch {
    return u.trim().replace(/\/+$/, "");
  }
}

function domain(u) {
  try { return new URL(u).hostname; } catch { return ""; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function tagColorClass(t) {
  const s = String(t);
  // female를 먼저 (female 문자열 안에 male이 포함됨)
  if (/(?:female:|Female:|여:|여자:)/.test(s)) return "female";
  if (/(?:male:|Male:|남:|남자:)/.test(s)) return "male";
  if (/(?:tag:|Tag:|태그:)/.test(s)) return "tagprefix";
  return "";
}

function pad2(n) {
  n = parseInt(n, 10);
  if (isNaN(n) || n < 0) n = 0;
  return String(n).padStart(2, "0");
}
function getDurationValue() {
  return pad2($("durH").value) + ":" + pad2($("durM").value) + ":" + pad2($("durS").value);
}
function setDurationValue(str) {
  const m = String(str || "00:00:00").match(/^(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  $("durH").value = m ? parseInt(m[1], 10) : 0;
  $("durM").value = m ? parseInt(m[2], 10) : 0;
  $("durS").value = m ? parseInt(m[3], 10) : 0;
}

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 3);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_BOOKMARKS)) d.createObjectStore(STORE_BOOKMARKS, { keyPath: "id" });
      if (!d.objectStoreNames.contains(STORE_TAGS)) d.createObjectStore(STORE_TAGS, { keyPath: "name" });
      if (!d.objectStoreNames.contains(STORE_CATS)) d.createObjectStore(STORE_CATS, { keyPath: "id" });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}

function allBookmarks() {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_BOOKMARKS).objectStore(STORE_BOOKMARKS).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function putBookmark(x) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_BOOKMARKS, "readwrite").objectStore(STORE_BOOKMARKS).put(x);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function delBookmark(id) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_BOOKMARKS, "readwrite").objectStore(STORE_BOOKMARKS).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function allRegisteredTags() {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_TAGS).objectStore(STORE_TAGS).getAll();
    r.onsuccess = () => res(r.result.map(t => t.name));
    r.onerror = () => rej(r.error);
  });
}
function putRegisteredTag(name) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_TAGS, "readwrite").objectStore(STORE_TAGS).put({ name });
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function delRegisteredTag(name) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_TAGS, "readwrite").objectStore(STORE_TAGS).delete(name);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function allCategories() {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_CATS).objectStore(STORE_CATS).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function putCategory(c) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_CATS, "readwrite").objectStore(STORE_CATS).put(c);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function delCategory(id) {
  return new Promise((res, rej) => {
    const r = db.transaction(STORE_CATS, "readwrite").objectStore(STORE_CATS).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function getCatById(id) {
  return categories.find(c => c.id === id) || null;
}

function getCatPath(id) {
  const parts = [];
  let cur = getCatById(id);
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    parts.unshift(cur.name);
    cur = cur.parentId ? getCatById(cur.parentId) : null;
  }
  return parts.join(" / ");
}

function getDescendantIds(id) {
  const result = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const c of categories) {
      if (c.parentId && result.has(c.parentId) && !result.has(c.id)) {
        result.add(c.id);
        changed = true;
      }
    }
  }
  return result;
}

function getChildren(parentId) {
  return categories
    .filter(c => (c.parentId || null) === (parentId || null))
    .sort((a, b) => a.name.localeCompare(b.name, "ko"));
}

function countBookmarksInCat(catId) {
  if (!catId) return 0;
  const ids = getDescendantIds(catId);
  return items.filter(x => x.categoryId && ids.has(x.categoryId)).length;
}

async function ensureCategoryPath(pathParts) {
  if (!pathParts || !pathParts.length) return null;
  let parentId = null;
  for (const name of pathParts) {
    const n = name.trim();
    if (!n) continue;
    let found = categories.find(c => c.name === n && (c.parentId || null) === parentId);
    if (!found) {
      found = { id: uid(), name: n, parentId };
      await putCategory(found);
      categories.push(found);
    }
    parentId = found.id;
  }
  return parentId;
}

async function resolveCategoryPath(pathStr) {
  if (!pathStr || !pathStr.trim()) return null;
  const parts = pathStr.split(/[\/＞>]/).map(s => s.trim()).filter(Boolean);
  return ensureCategoryPath(parts);
}

async function refresh() {
  items = await allBookmarks();
  registeredTags = await allRegisteredTags();
  categories = await allCategories();

  for (const x of items) {
    if (x.category && !x.categoryId) {
      const id = await resolveCategoryPath(x.category);
      if (id) {
        x.categoryId = id;
        delete x.category;
        await putBookmark(x);
      }
    }
  }

  const used = new Set();
  items.forEach(x => (x.tags || []).forEach(t => used.add(t)));
  registeredTags.forEach(t => used.add(t));
  registeredTags = [...used].sort((a, b) => a.localeCompare(b, "ko"));
  render();
}

function getFilteredItems() {
  const q = $("search").value.trim().toLowerCase();
  const scope = $("searchScope").value || "all";

  return items.filter(x => {
    if (q) {
      let text = "";
      if (scope === "all") {
        const catPath = x.categoryId ? getCatPath(x.categoryId) : "";
        text = [x.title, x.url, x.notes, catPath, ...(x.tags || [])].join(" ").toLowerCase();
      } else if (scope === "title") {
        text = (x.title || "").toLowerCase();
      } else if (scope === "tag") {
        text = (x.tags || []).join(" ").toLowerCase();
      } else if (scope === "category") {
        text = (x.categoryId ? getCatPath(x.categoryId) : "").toLowerCase();
      }
      if (!text.includes(q)) return false;
    }

    const ts = new Set(x.tags || []);
    for (const [tag, state] of Object.entries(tagStates)) {
      if (state === "include" && !ts.has(tag)) return false;
      if (state === "exclude" && ts.has(tag)) return false;
    }

    if (selectedCatId) {
      if (!x.categoryId) return false;
      if (includeDescendants) {
        if (!getDescendantIds(selectedCatId).has(x.categoryId)) return false;
      } else if (x.categoryId !== selectedCatId) return false;
    }
    return true;
  });
}

function render() {
  renderSearchResults();
  renderTagGrid();
  renderRegisteredTagList();
  renderCatTree();
  populateCatParentSelect();
}

function renderSearchResults() {
  const filtered = getFilteredItems();
  const sort = $("sort").value;

  filtered.sort((a, b) => {
    if (sort === "title") return (a.title || "").localeCompare(b.title || "", "ko");
    if (sort === "domain") return domain(a.url).localeCompare(domain(b.url));
    return b.updatedAt - a.updatedAt;
  });

  $("stats").textContent = filtered.length + "개 표시 · 전체 " + items.length + "개";
  $("cards").innerHTML = filtered.length
    ? filtered.map(card).join("")
    : '<div class="empty">북마크가 없습니다.<br>「＋ 북마크」 또는 「가져오기」로 시작하세요.</div>';
  if (filtered.length) bindCardEvents();
}

function card(x) {
  const tagsHtml = (x.tags || []).map(t =>
    '<span class="chip ' + tagColorClass(t) + '">' + esc(t) + '</span>'
  ).join("");
  const catPath = x.categoryId ? getCatPath(x.categoryId) : "";
  const catHtml = catPath ? '<span class="chip cat">' + esc(catPath) + '</span>' : "";
  let metaHtml = "";
  if (x.metaType === "pages" && x.pages) metaHtml = '<div class="meta">' + x.pages + ' 페이지</div>';
  if (x.metaType === "duration" && x.duration) metaHtml = '<div class="meta">' + esc(x.duration) + '</div>';

  return '<article class="card" data-id="' + esc(x.id) + '">' +
    '<div class="card-title">' + esc(x.title || x.url) + '</div>' +
    '<div class="url-row">' +
      '<button type="button" class="btn sm url-toggle" data-toggle-url>URL 펼치기</button>' +
      '<div class="url hidden">' + esc(x.url) + '</div>' +
    '</div>' +
    metaHtml +
    (x.notes ? '<div class="notes">' + esc(x.notes) + '</div>' : '') +
    '<div class="chips">' + catHtml + tagsHtml + '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn" data-open-url="' + esc(x.url) + '">열기</button>' +
      '<button type="button" class="btn" data-edit-id="' + esc(x.id) + '">수정</button>' +
      '<button type="button" class="btn danger" data-del-id="' + esc(x.id) + '">삭제</button>' +
    '</div></article>';
}

function bindCardEvents() {
  $("cards").querySelectorAll("[data-open-url]").forEach(btn => {
    btn.onclick = () => window.open(btn.getAttribute("data-open-url"), "_blank");
  });
  $("cards").querySelectorAll("[data-edit-id]").forEach(btn => {
    btn.onclick = () => editItem(btn.getAttribute("data-edit-id"));
  });
  $("cards").querySelectorAll("[data-del-id]").forEach(btn => {
    btn.onclick = () => removeItem(btn.getAttribute("data-del-id"));
  });
  $("cards").querySelectorAll("[data-toggle-url]").forEach(btn => {
    btn.onclick = () => {
      const urlEl = btn.parentElement.querySelector(".url");
      urlEl.classList.toggle("hidden");
      btn.textContent = urlEl.classList.contains("hidden") ? "URL 펼치기" : "URL 접기";
    };
  });
}

function renderTagGrid() {
  const q = ($("tagFilterSearch")?.value || "").trim().toLowerCase();
  const counts = {};
  items.forEach(x => (x.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const allTags = [...new Set([...registeredTags, ...Object.keys(counts)])].sort((a, b) => a.localeCompare(b, "ko"));
  const visible = q ? allTags.filter(t => t.toLowerCase().includes(q)) : allTags;

  $("tagGrid").innerHTML = visible.length
    ? visible.map(t => {
        const state = tagStates[t] || "";
        return '<button class="tag-btn ' + state + ' ' + tagColorClass(t) + '" data-tag="' + esc(t) + '">' + esc(t) + ' <span class="cnt">' + (counts[t] || 0) + '</span></button>';
      }).join("")
    : '<div class="empty" style="padding:20px">태그가 없습니다.</div>';

  document.querySelectorAll("#tagGrid .tag-btn").forEach(btn => {
    btn.onclick = () => cycleTagState(btn.dataset.tag);
  });
}

function cycleTagState(tag) {
  const cur = tagStates[tag] || null;
  if (cur === null) tagStates[tag] = "include";
  else if (cur === "include") tagStates[tag] = "exclude";
  else delete tagStates[tag];
  render();
}

function renderRegisteredTagList() {
  const box = $("registeredTagList");
  if (!box) return;
  const list = [...registeredTags].sort((a, b) => a.localeCompare(b, "ko"));
  box.innerHTML = list.length
    ? list.map(t =>
      '<div class="reg-tag-row">' +
        '<span class="chip ' + tagColorClass(t) + '" style="flex:1">' + esc(t) + '</span>' +
        '<button class="btn sm" data-ren-tag="' + esc(t) + '">수정</button>' +
        '<button class="btn sm danger" data-del-tag="' + esc(t) + '">삭제</button>' +
      '</div>').join("")
    : '<div class="empty" style="padding:8px">등록된 태그 없음</div>';

  box.querySelectorAll("[data-ren-tag]").forEach(btn => {
    btn.onclick = async () => {
      const oldName = btn.dataset.renTag;
      const neu = prompt("새 태그 이름:", oldName);
      if (!neu || !neu.trim() || neu.trim() === oldName) return;
      const name = neu.trim();
      await delRegisteredTag(oldName);
      await putRegisteredTag(name);
      for (const x of items) {
        if ((x.tags || []).includes(oldName)) {
          x.tags = x.tags.map(t => t === oldName ? name : t);
          x.updatedAt = Date.now();
          await putBookmark(x);
        }
      }
      if (tagStates[oldName]) {
        tagStates[name] = tagStates[oldName];
        delete tagStates[oldName];
      }
      await refresh();
    };
  });
  box.querySelectorAll("[data-del-tag]").forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.delTag;
      if (!confirm('태그 "' + name + '" 등록을 삭제할까요?\n(북마크에 붙은 태그는 그대로 남습니다)')) return;
      await delRegisteredTag(name);
      registeredTags = registeredTags.filter(t => t !== name);
      delete tagStates[name];
      render();
    };
  });
}

function renderCatTree() {
  const q = ($("catFilterSearch")?.value || "").trim().toLowerCase();
  const container = $("catTree");

  function hasMatchingDescendant(id, query) {
    for (const c of getChildren(id)) {
      if (c.name.toLowerCase().includes(query) || getCatPath(c.id).toLowerCase().includes(query)) return true;
      if (hasMatchingDescendant(c.id, query)) return true;
    }
    return false;
  }

  function renderNode(parentId) {
    let children = getChildren(parentId);
    if (q) {
      children = children.filter(c => {
        const path = getCatPath(c.id).toLowerCase();
        return path.includes(q) || hasMatchingDescendant(c.id, q);
      });
    }
    if (!children.length) return "";

    return children.map(c => {
      const hasKids = getChildren(c.id).length > 0;
      const isExpanded = expandedCats.has(c.id) || (q && hasMatchingDescendant(c.id, q));
      const cnt = countBookmarksInCat(c.id);
      const isActive = selectedCatId === c.id;
      const kidsHtml = (hasKids && isExpanded) ? '<div class="cat-children">' + renderNode(c.id) + '</div>' : "";

      return '<div>' +
        '<div class="cat-node ' + (isActive ? "active" : "") + '">' +
          '<button class="cat-toggle ' + (hasKids ? "" : "invisible") + '" data-toggle="' + c.id + '">' + (isExpanded ? "▼" : "▶") + '</button>' +
          '<button class="cat-label" data-select="' + c.id + '">' + esc(c.name) + '</button>' +
          '<span class="cat-cnt">' + cnt + '</span>' +
          '<div class="cat-actions">' +
            '<button data-add-child="' + c.id + '" title="하위에 추가">＋</button>' +
            '<button data-rename="' + c.id + '" title="이름 변경">✎</button>' +
            '<button data-del="' + c.id + '" title="삭제">×</button>' +
          '</div>' +
        '</div>' +
        kidsHtml +
      '</div>';
    }).join("");
  }

  container.innerHTML = renderNode(null) || '<div class="empty" style="padding:20px">카테고리가 없습니다.</div>';

  container.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const id = btn.dataset.toggle;
      if (expandedCats.has(id)) expandedCats.delete(id);
      else expandedCats.add(id);
      renderCatTree();
    };
  });
  container.querySelectorAll("[data-select]").forEach(btn => {
    btn.onclick = () => {
      selectedCatId = selectedCatId === btn.dataset.select ? null : btn.dataset.select;
      render();
    };
  });
  container.querySelectorAll("[data-add-child]").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const name = prompt("하위 카테고리 이름:");
      if (name && name.trim()) addCategory(name.trim(), btn.dataset.addChild);
    };
  });
  container.querySelectorAll("[data-rename]").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const cat = getCatById(btn.dataset.rename);
      if (!cat) return;
      const name = prompt("새 이름:", cat.name);
      if (name && name.trim() && name.trim() !== cat.name) {
        cat.name = name.trim();
        putCategory(cat).then(refresh);
      }
    };
  });
  container.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const id = btn.dataset.del;
      const cat = getCatById(id);
      if (!cat) return;
      const kids = getChildren(id);
      const cnt = countBookmarksInCat(id);
      let msg = '"' + cat.name + '" 카테고리를 삭제할까요?';
      if (kids.length) msg += "\n하위 " + kids.length + "개도 함께 삭제됩니다.";
      if (cnt) msg += "\n속한 북마크 " + cnt + "개의 카테고리가 해제됩니다.";
      if (!confirm(msg)) return;

      const toDelete = [...getDescendantIds(id)];
      for (const did of toDelete) await delCategory(did);
      for (const x of items) {
        if (x.categoryId && toDelete.includes(x.categoryId)) {
          x.categoryId = null;
          await putBookmark(x);
        }
      }
      if (selectedCatId && toDelete.includes(selectedCatId)) selectedCatId = null;
      await refresh();
    };
  });
}

function populateCatParentSelect() {
  const sel = $("newCatParent");
  const current = sel.value;
  const opts = ['<option value="">(최상위)</option>'];
  function walk(parentId, depth) {
    for (const c of getChildren(parentId)) {
      opts.push('<option value="' + c.id + '">' + "　".repeat(depth) + esc(c.name) + '</option>');
      walk(c.id, depth + 1);
    }
  }
  walk(null, 0);
  sel.innerHTML = opts.join("");
  if (current) sel.value = current;
}

async function addCategory(name, parentId = null) {
  const exists = categories.some(c => c.name === name && (c.parentId || null) === (parentId || null));
  if (exists) {
    alert("같은 부모 아래 동일한 이름이 이미 있습니다.");
    return;
  }
  const c = { id: uid(), name, parentId: parentId || null };
  await putCategory(c);
  categories.push(c);
  if (parentId) expandedCats.add(parentId);
  render();
}

});

$("clearTagFilters").onclick = () => { tagStates = {}; render(); };
$("clearCatFilter").onclick = () => { selectedCatId = null; render(); };
$("tagFilterSearch").oninput = () => { renderTagGrid(); };
$("catFilterSearch").oninput = () => renderCatTree();
$("includeDescendants").onchange = e => {

};

$("addRegisteredTag").onclick = async () => {

function showEdit(x) {
  editingId = x?.id || null;
  $("modalTitle").textContent = x ? "북마크 수정" : "북마크 추가";
  $("url").value = x?.url || "";
  $("title").value = x?.title || "";
  $("notes").value = x?.notes || "";
  currentSelectedTags = [...(x?.tags || [])];
  currentCategoryId = x?.categoryId || null;

  const mt = x?.metaType || "";
  $("metaType").value = mt;
  $("metaPages").value = x?.pages ?? "";
  setDurationValue(x?.duration || "00:00:00");
  $("metaPagesField").classList.toggle("hidden", mt !== "pages");
  $("metaDurationField").classList.toggle("hidden", mt !== "duration");

  renderSelectedTags();
  renderSelectedCat();
  $("tagPickerInput").value = "";
  $("catPickerInput").value = "";
  $("tagSuggest").classList.remove("open");
  $("catSuggest").classList.remove("open");
  $("editModal").classList.add("open");
}

function renderSelectedTags() {
  $("selectedTags").innerHTML = currentSelectedTags.map(t =>
    '<span class="chip ' + tagColorClass(t) + '">' + esc(t) + ' <button type="button" data-rm="' + esc(t) + '">×</button></span>'
  ).join("");
  $("selectedTags").querySelectorAll("[data-rm]").forEach(btn => {
    btn.onclick = () => {
      currentSelectedTags = currentSelectedTags.filter(t => t !== btn.dataset.rm);
      renderSelectedTags();
    };
  });
}

function renderSelectedCat() {
  const box = $("selectedCat");
  if (!currentCategoryId) { box.innerHTML = ""; return; }
  const path = getCatPath(currentCategoryId);
  box.innerHTML = '<span class="chip">' + esc(path) + ' <button type="button" id="clearSelectedCat">×</button></span>';
  $("clearSelectedCat").onclick = () => {
    currentCategoryId = null;
    renderSelectedCat();
  };
}

function showTagSuggest(q) {
  const box = $("tagSuggest");
  const lower = q.toLowerCase();
  const candidates = registeredTags
    .filter(t => t.toLowerCase().includes(lower) && !currentSelectedTags.includes(t))
    .slice(0, 12);
  if (!candidates.length) { box.classList.remove("open"); return; }
  box.innerHTML = candidates.map(t =>
    '<div data-tag="' + esc(t) + '" class="' + tagColorClass(t) + '">' + esc(t) + '</div>'
  ).join("");
  box.classList.add("open");
  box.querySelectorAll("div").forEach(div => {
    div.onclick = () => {
      addTagToSelection(div.dataset.tag);
      $("tagPickerInput").value = "";
      box.classList.remove("open");
    };
  });
}

function addTagToSelection(tag) {
  tag = tag.trim();
  if (!tag || currentSelectedTags.includes(tag)) return;
  currentSelectedTags.push(tag);
  if (!registeredTags.includes(tag)) {
    putRegisteredTag(tag).then(() => {
      registeredTags.push(tag);
      registeredTags.sort((a, b) => a.localeCompare(b, "ko"));
    });
  }
  renderSelectedTags();
}

function showCatSuggest(q) {
  const box = $("catSuggest");
  const lower = (q || "").toLowerCase();
  const ordered = [];
  function walk(parentId, depth) {
    for (const c of getChildren(parentId)) {
      const path = getCatPath(c.id);
      if (!lower || path.toLowerCase().includes(lower) || c.name.toLowerCase().includes(lower)) {
        ordered.push({ id: c.id, name: c.name, depth });
      }
      walk(c.id, depth + 1);
    }
  }
  walk(null, 0);
  const list = ordered.slice(0, 40);
  const createHint = q && /[\/＞>]/.test(q)
    ? '<div data-create="' + esc(q.trim()) + '" style="border-top:1px solid var(--line);color:var(--accent)"><strong>새로 만들기:</strong> ' + esc(q.trim()) + '</div>'
    : "";

  if (!list.length && !createHint) { box.classList.remove("open"); return; }

  box.innerHTML = list.map(c =>
    '<div data-id="' + c.id + '" style="padding-left:' + (8 + c.depth * 16) + 'px">' + esc(c.name) + '</div>'
  ).join("") + createHint;
  box.classList.add("open");

  box.querySelectorAll("[data-id]").forEach(div => {
    div.onclick = () => {
      currentCategoryId = div.dataset.id;
      renderSelectedCat();
      $("catPickerInput").value = "";
      box.classList.remove("open");
    };
  });
  box.querySelectorAll("[data-create]").forEach(div => {
    div.onclick = async () => {
      currentCategoryId = await resolveCategoryPath(div.dataset.create);
      renderSelectedCat();
      $("catPickerInput").value = "";
      box.classList.remove("open");
      render();
    };
  });
}

$("tagPickerInput").oninput = e => showTagSuggest(e.target.value);
$("tagPickerInput").onkeydown = e => {

    e.preventDefault();

$("catPickerInput").oninput = e => showCatSuggest(e.target.value);
$("catPickerInput").onfocus = e => showCatSuggest(e.target.value);
$("catPickerInput").onkeydown = e => {

    e.preventDefault();
    const v = e.target.value.trim();
    if (v) {

        renderSelectedCat();
        e.target.value = "";

      });

  }
};

$("metaType").onchange = () => {
  const v = $("metaType").value;
  $("metaPagesField").classList.toggle("hidden", v !== "pages");
  $("metaDurationField").classList.toggle("hidden", v !== "duration");
};

document.addEventListener("click", e => {
  if (!e.target.closest(".tag-picker")) $("tagSuggest").classList.remove("open");
  if (!e.target.closest(".cat-picker")) $("catSuggest").classList.remove("open");

window.editItem = id => showEdit(items.find(x => x.id === id));
window.removeItem = async id => {
  if (confirm("이 북마크를 삭제할까요?")) {
    await delBookmark(id);
    await refresh();

};

$("addBtn").onclick = () => showEdit();
$("cancelBtn").onclick = () => $("editModal").classList.remove("open");

$("saveBtn").onclick = async () => {
  let url = normalizeUrl($("url").value);
  if (!url || !/^https?:\/\//i.test(url)) {
    alert("http:// 또는 https:// URL을 입력하세요.");
    return;
  }
  const duplicate = items.find(x => normalizeUrl(x.url) === url && x.id !== editingId);
  if (duplicate && !confirm("같은 URL의 북마크가 이미 있습니다. 그래도 저장할까요?")) return;

  const now = Date.now();
  const old = editingId ? items.find(x => x.id === editingId) : null;
  const metaType = $("metaType").value || "";
  const x = {
    id: editingId || uid(),
    url,
    title: $("title").value.trim() || url,
    categoryId: currentCategoryId || null,
    tags: [...new Set(currentSelectedTags)],
    notes: $("notes").value.trim(),
    metaType,
    pages: metaType === "pages" ? (parseInt($("metaPages").value, 10) || null) : null,
    duration: metaType === "duration" ? getDurationValue() : null,
    createdAt: old?.createdAt || now,
    updatedAt: now
  };

  $("editModal").classList.remove("open");
  await refresh();
};

$("importBtn").onclick = () => $("importModal").classList.add("open");
$("importCancel").onclick = () => $("importModal").classList.remove("open");

$("fileInput").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  try {
    const n = await importData(text, f.name);
    alert(n.added + "개 추가, " + n.duplicates + "개 중복 건너뜀");
    $("importModal").classList.remove("open");
    e.target.value = "";
    await refresh();
  } catch (err) {
    alert("가져오기 실패: " + err.message);
  }
};

async function importData(text, name) {
  let data = [];
  if (/\.json$/i.test(name)) {
    const j = JSON.parse(text);
    data = Array.isArray(j) ? j : (j.bookmarks || []);
    if (j.categories && Array.isArray(j.categories)) {
      for (const c of j.categories) {
        if (!categories.find(x => x.id === c.id)) {
          await putCategory(c);
          categories.push(c);
        }
      }
    }
    if (j.registeredTags && Array.isArray(j.registeredTags)) {
      for (const t of j.registeredTags) {
        if (!registeredTags.includes(t)) {
          await putRegisteredTag(t);
          registeredTags.push(t);
        }
      }
    }
  } else if (/\.html?$/i.test(name)) {
    data = parseBookmarkHTML(text);
  } else {
    data = parseText(text);
  }

  let added = 0, duplicates = 0;
  const now = Date.now();
  const existingUrls = new Set(items.map(x => normalizeUrl(x.url)));

  for (const raw of data) {
    if (!raw.url || !/^https?:\/\//i.test(raw.url.trim())) continue;
    const url = normalizeUrl(raw.url);
    if (existingUrls.has(url)) { duplicates++; continue; }
    existingUrls.add(url);

    const tags = [...new Set((raw.tags || []).filter(Boolean))];
    for (const t of tags) {
      if (!registeredTags.includes(t)) {
        await putRegisteredTag(t);
        registeredTags.push(t);
      }
    }

    let categoryId = raw.categoryId || null;
    if (!categoryId && raw.categoryPath && raw.categoryPath.length) categoryId = await ensureCategoryPath(raw.categoryPath);
    else if (!categoryId && raw.category) categoryId = await resolveCategoryPath(raw.category);

    const item = {
      id: raw.id || uid(),
      url,
      title: raw.title?.trim() || url,
      categoryId,
      tags,
      notes: raw.notes || "",
      metaType: raw.metaType || "",
      pages: raw.pages ?? null,
      duration: raw.duration ?? null,
      createdAt: raw.createdAt || now,
      updatedAt: now
    };
    await putBookmark(item);
    items.push(item);
    added++;
  }
  registeredTags.sort((a, b) => a.localeCompare(b, "ko"));
  return { added, duplicates };
}

function parseText(t) {
  const out = [];
  for (const line of t.split(/\r?\n/)) {
    const m = line.match(/https?:\/\/\S+/i);
    if (m) {
      const url = m[0].replace(/[),.;]+$/, "");
      const title = line.slice(0, m.index).trim() || url;
      out.push({ url, title, tags: [] });
    }
  }
  return out;
}

function parseBookmarkHTML(t) {
  const doc = new DOMParser().parseFromString(t, "text/html");
  const out = [];
  function walk(node, path = []) {
    for (const el of node.children || []) {
      if (el.tagName === "DT") {
        const h = el.querySelector(":scope > H3");
        const a = el.querySelector(":scope > A");
        if (h) {
          const dl = el.querySelector(":scope > DL");
          walk(dl || el, path.concat(h.textContent.trim()));
        } else if (a) {
          out.push({
            url: a.getAttribute("HREF") || "",
            title: a.textContent.trim(),
            categoryPath: path.length ? path : null,
            tags: []
          });
        }
      } else walk(el, path);
    }
  }
  walk(doc.body, []);
  return out;
}

$("exportBtn").onclick = async () => {
  const data = await allBookmarks();
  const tags = await allRegisteredTags();
  const cats = await allCategories();
  const blob = new Blob([JSON.stringify({
    version: 3,
    exportedAt: new Date().toISOString(),
    bookmarks: data,
    registeredTags: tags,
    categories: cats
  }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tagmark-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

$("search").oninput = render;
$("searchScope").onchange = render;
$("sort").onchange = render;

openDB().then(refresh);
