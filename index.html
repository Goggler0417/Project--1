<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Tagmark</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div><b>Tagmark</b><span id="syncState">로컬 모드</span></div>
  <div class="actions"><button id="loginBtn">로그인</button><button id="addBtn" class="primary">＋ 추가</button></div>
</header>
<main>
  <section class="searchbox">
    <input id="search" placeholder="제목, URL, 메모, 태그 검색…">
    <select id="logic"><option value="AND">태그 AND</option><option value="OR">태그 OR</option></select>
  </section>
  <section class="filters">
    <div id="tags"></div>
    <button id="clear">필터 초기화</button>
  </section>
  <div class="bar"><span id="count"></span><span>선택 태그: <b id="selected"></b></span></div>
  <section id="list"></section>
  <section id="empty" hidden><h2>북마크가 없습니다</h2><p>URL을 추가하고 태그를 붙여보세요.</p></section>
</main>

<dialog id="editor"><form id="form">
<h2 id="formTitle">북마크 추가</h2>
<label>URL<input id="url" type="url" required></label>
<label>제목<input id="title"></label>
<label>태그<input id="tagInput" placeholder="공부, 의학, 참고자료"></label>
<label>메모<textarea id="notes" rows="4"></textarea></label>
<div class="dialogActions"><button type="button" id="cancel">취소</button><button class="primary">저장</button></div>
</form></dialog>

<dialog id="login"><form id="loginForm">
<h2>클라우드 동기화</h2>
<p class="hint">Supabase 설정 후 이메일 로그인으로 여러 기기에서 동기화할 수 있습니다.</p>
<label>이메일<input id="email" type="email" required></label>
<label>비밀번호<input id="password" type="password" required></label>
<div class="dialogActions"><button type="button" id="loginCancel">취소</button><button class="primary">로그인/가입</button></div>
<p id="loginMsg" class="hint"></p>
</form></dialog>

<script src="config.js"></script><script src="app.js"></script>
</body></html>
