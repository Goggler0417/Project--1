<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tagmark Local v1</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#697386;--line:#e5e9f0;--accent:#2563eb;--danger:#dc2626;--chip:#eef2ff;--inc:#dcfce7;--exc:#fee2e2;--inc-t:#166534;--exc-t:#991b1b;--cat:#fef3c7;--cat-t:#92400e;--male:#2563eb;--female:#dc2626;--artist:#7c3aed;--series:#16a34a;--tag:#111827;--character:#0e7490;--character-bg:#cffafe;--character-line:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:env(safe-area-inset-top) 16px 30px}
header{padding:18px 4px 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted)}
.cat-title{font-size:20px;font-weight:800;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn.sm{padding:6px 10px;font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 16px;border:0;background:0;border-radius:10px 10px 0 0;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--panel);margin-bottom:-1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px #00000008}
.side{padding:16px}
.side-title{font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.side-search,input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;outline:0}
.searchbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:120px;padding:12px;border:1px solid var(--line);border-radius:11px;outline:0;margin:0}
.select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;margin:0;width:auto}
.stats{padding:10px 14px;color:var(--muted);font-size:13px}
.cards{padding:0 12px 12px;display:grid;gap:9px}
.card{border:1px solid var(--line);border-radius:13px;padding:13px}
.card-title{font-weight:700;overflow-wrap:anywhere}
.url-row{margin:4px 0 9px}.url{color:var(--accent);font-size:13px;overflow-wrap:anywhere;margin-top:6px}
.notes{font-size:13px;color:#4b5563;margin:7px 0;white-space:pre-wrap}.meta{font-size:12px;color:var(--muted);margin:4px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:4px 8px;font-size:12px;color:var(--tag)}
.chip.cat{background:var(--cat);color:var(--cat-t)}.chip.char{background:#ede9fe;color:#5b21b6}
.chip.male,.tb.male{color:var(--male)!important}.chip.female,.tb.female{color:var(--female)!important}
.chip.artist,.tb.artist{color:var(--artist)!important}.chip.series,.tb.series{color:var(--series)!important}.chip.character,.tb.character{background:var(--character-bg);color:var(--character)!important;border-color:var(--character-line)}
.chip.tagprefix,.tb.tagprefix{color:var(--tag)!important}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.actions .btn{padding:7px 9px;font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--tag)}
.tb:hover{background:var(--chip)}.tb.include{background:var(--inc);border-color:#86efac;color:var(--inc-t)}.tb.exclude{background:var(--exc);border-color:#fca5a5;color:var(--exc-t)}
.tb .cnt{font-size:11px;opacity:.7}
.tag-legend{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.manage{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reg-row{display:flex;align-items:center;gap:6px;padding:4px 0}
.cat-list{display:flex;flex-direction:column;gap:6px}
.cat-item{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.cat-item .name{flex:1;font-weight:700;text-align:left;border:0;background:0;font-size:15px;cursor:pointer}
.cat-item .name:hover{color:var(--accent)}
.cat-sub{margin:4px 0 8px 12px;padding-left:12px;border-left:2px solid var(--line)}
.cat-sub-item{display:flex;align-items:center;gap:6px;padding:6px 0}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:17px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:18px}
.dialog h2{margin:0 0 12px}.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field textarea{min-height:70px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.hidden{display:none!important}
.importbox{border:1px dashed #b9c2d0;padding:14px;border-radius:12px;background:#fafbfe}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.picker{position:relative}
.suggest{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:200px;overflow:auto;box-shadow:0 8px 20px #0001;display:none}
.suggest.open{display:block}.suggest div{padding:8px 12px;cursor:pointer;font-size:13px}
.suggest.tag div:hover{background:var(--chip)}.suggest.cat div:hover{background:var(--cat)}
.selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.selected .chip{padding:5px 10px;display:inline-flex;align-items:center;gap:4px}
.selected .chip button{border:0;background:0;padding:0 2px;font-size:14px;color:var(--muted)}
.dur{display:flex;align-items:center;gap:6px}.dur input{width:4.2em;text-align:center;margin:0}
.char-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfe}
.char-box .row input,.char-box .row select{margin:0;flex:1;min-width:70px}.char-basic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.char-gender{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}.char-gender label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin:0}.char-gender input{margin:0;width:auto}.char-tag-picker{min-width:0}
.char-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:13px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.crumb a,.crumb button.link{border:0;background:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:none}
.crumb a:hover,.crumb button.link:hover{text-decoration:underline}
.crumb .sep{color:var(--muted)}
.crumb .cur{font-weight:800;color:var(--text)}
@media(max-width:760px){.app{padding-left:10px;padding-right:10px}.toolbar{width:100%}.toolbar .btn{flex:1}}
.reg-tag-kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px 18px;margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafbfe}.reg-tag-kinds label{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;cursor:pointer;font-size:13px}.reg-tag-kinds input{margin:0;width:auto;flex:0 0 auto}.char-tag-picker{position:relative}.char-tag-suggest{position:absolute;z-index:20;left:0;right:0;top:100%;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 5px 16px rgba(0,0,0,.12);max-height:220px;overflow:auto}.char-tag-suggest.open{display:block}.char-tag-suggest button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;cursor:pointer}.char-tag-suggest button:hover{background:#f1f4f8}.char-tag-suggest .new-char-tag{font-weight:600}.main-info{margin:3px 0 8px}.main-info-line{font-size:15.5px;line-height:1.45;font-weight:650;overflow-wrap:anywhere}.main-info-label{font-weight:800}.card-title{font-size:18px;line-height:1.3;font-weight:800;overflow-wrap:anywhere}.card .chips{margin-top:7px}@media(max-width:620px){.reg-tag-kinds{grid-template-columns:repeat(2,minmax(0,1fr))}.char-basic{grid-template-columns:minmax(0,1fr) auto}.char-gender{gap:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="logo">Tagmark</div><div class="sub">Local v1</div></div>
  <div class="toolbar">
    <button class="btn primary hidden" id="addBtn">＋ 북마크</button>
    <button class="btn" id="importBtn">가져오기</button>
    <button class="btn" id="exportBtn">백업</button>
  </div>
</header>

<!-- 상하 구조 내비: 카테고리 관리 > 최상위 카테고리 -->
<div class="crumb" id="crumb"></div>

<!-- 카테고리 관리 (최상위 페이지) -->
<div id="view-manage" class="panel side">
  <div class="side-title"><span>카테고리 관리</span></div>
  <p class="hint">카테고리 관리(상위)에서 최상위 카테고리를 만든 뒤 이름을 누르면 해당 메인·태그 페이지(하위)로 들어갑니다.</p>
  <div class="cat-list" id="catManageList"></div>
  <div class="manage">
    <div class="side-title" style="margin-bottom:8px">최상위 카테고리 추가</div>
    <input id="newTopCat" placeholder="">
    <button class="btn primary" id="addTopCat" style="width:100%">추가</button>
  </div>
</div>

<!-- 워크스페이스: 메인(검색) -->
<div id="view-main" class="panel hidden">
  <div class="tabs" id="wsTabs">
    <button class="tab active" data-ws="main">메인</button>
    <button class="tab" data-ws="tags">태그 관리</button>
  </div>
  <div id="ws-main">
    <div class="searchbar">
      <input class="search" id="search" placeholder="">
      <select class="select" id="searchScope">
        <option value="all">전체</option><option value="title">제목</option>
        <option value="tag">태그</option><option value="char">등장인물</option>
      </select>
      <select class="select" id="sort">
        <option value="updated">최근 수정</option><option value="title">제목</option><option value="domain">도메인</option>
      </select>
      <select class="select" id="subCatFilter"><option value="">하위 전체</option></select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="cards" id="cards"></div>
  </div>
  <!-- 워크스페이스: 태그 관리 -->
  <div id="ws-tags" class="side hidden">
    <div class="side-title"><span>태그 필터</span><button class="btn sm" id="clearTagFilters">초기화</button></div>
    <input class="side-search" id="tagFilterSearch" placeholder="">
    <div class="tag-grid" id="tagGrid"></div>
    <div class="tag-legend">1회 포함 · 2회 제외 · 3회 해제</div>
    <div class="manage">
      <div class="side-title" style="margin-bottom:8px">사전 등록 태그</div>
      <div id="newTagKinds" class="reg-tag-kinds">
        <label><input type="radio" name="newTagKind" value="male:"> male:</label>
        <label><input type="radio" name="newTagKind" value="female:"> female:</label>
        <label><input type="radio" name="newTagKind" value="artist:"> artist:</label>
        <label><input type="radio" name="newTagKind" value="series:"> series:</label>
        <label><input type="radio" name="newTagKind" value="language:"> language:</label>
        <label><input type="radio" name="newTagKind" value="character:"> character:</label>
        <label><input type="radio" name="newTagKind" value="cast:"> cast:</label>
        <label><input type="radio" name="newTagKind" value="tag:" checked> tag:</label>
      </div>
      <input id="newTagName" placeholder="">
      <input id="newTagSeries" placeholder="character/cast 연결 Series (선택)">
      <button class="btn primary" id="addRegisteredTag" style="width:100%">등록</button>
      <div id="registeredTagList" style="margin-top:10px"></div>
    </div>
  </div>
</div>
</div>

<!-- 편집 모달 -->
<div class="modal" id="editModal">
  <div class="dialog">
    <h2 id="modalTitle">북마크 추가</h2>
    <div class="field"><label>URL</label><input id="url" type="url" placeholder=""></div>
    <div class="field"><label>제목</label><input id="title" placeholder=""></div>
    <div class="field" id="charField" style="border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfe">
      <label style="margin-bottom:8px">등장인물</label>
      <div id="charList"></div>
      <button type="button" class="btn primary" id="addCharBtn" style="width:100%;margin-top:8px">＋ 등장인물 추가</button>
    </div>
    <div class="field"><label>하위 카테고리</label>
      <div class="picker"><input id="catPickerInput" placeholder="" autocomplete="off"><div class="suggest cat" id="catSuggest"></div></div>
      <div class="selected" id="selectedCat"></div>
    </div>
    <div class="field"><label>태그</label>
      <div class="picker"><input id="tagPickerInput" placeholder="" autocomplete="off"><div class="suggest tag" id="tagSuggest"></div></div>
      <div class="selected" id="selectedTags"></div>
    </div>
    <div class="field"><label>페이지 수 / 재생시간</label>
      <select id="metaType"><option value="">선택 안 함</option><option value="pages">페이지 수</option><option value="duration">재생시간</option></select>
    </div>
    <div class="field hidden" id="metaPagesField"><label>페이지 수</label><input id="metaPages" type="number" min="1" step="1" placeholder=""></div>
    <div class="field hidden" id="metaDurationField"><label>재생시간</label>
      <div class="dur"><input id="durH" type="number" min="0" max="99" value="0"><span>:</span>
        <input id="durM" type="number" min="0" max="59" value="0"><span>:</span>
        <input id="durS" type="number" min="0" max="59" value="0"></div>
    </div>
    <div class="field"><label>메모</label><textarea id="notes" placeholder=""></textarea></div>
    <div class="modal-actions"><button class="btn" id="cancelBtn">취소</button><button class="btn primary" id="saveBtn">저장</button></div>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="dialog">
    <h2>북마크 가져오기</h2>
    <div class="importbox">
      <input id="fileInput" type="file" accept=".json,.txt,.html,.htm">
      <p class="hint">JSON / 텍스트 / Chrome HTML. 현재 최상위 카테고리 기준으로 가져옵니다.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="importCancel">닫기</button></div>
  </div>
</div>

<script>
const DB="tagmark-local-v1", SB="bookmarks", ST="registeredTags", SC="categories";
let db, items=[], registeredTags=[], registeredTagMeta=[], categories=[];
let tagStates={}, activeTopId=null, includeDesc=true, expanded=new Set();
let editingId=null, curTags=[], curCatId=null, curChars=[];
let wsTab="main"; // main | tags
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

/** URL 정규화 */
function normalizeUrl(u){
  try{let x=new URL(u.trim());x.protocol=x.protocol.toLowerCase();x.hostname=x.hostname.toLowerCase();
    if((x.protocol==="https:"&&x.port==="443")||(x.protocol==="http:"&&x.port==="80"))x.port="";
    x.hash="";if(x.pathname.length>1)x.pathname=x.pathname.replace(/\/+$/,"");return x.toString();
  }catch{return u.trim().replace(/\/+$/,"")}
}
/** 호스트명 */ const domain=u=>{try{return new URL(u).hostname}catch{return""}};
/** HTML 이스케이프 */ const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/** 표시용: [최상위경로] 접두 제거 */ function tagLabel(t){
  return String(t).replace(/^\[[^\]]+\]\s*/,"")}
/** 태그 표시/색상 */ function isTextTag(t){return /^(?:artist|series|language):/i.test(tagLabel(t));}
function tagColor(t){
  const s=tagLabel(t);
  if(/^(?:character|cast):/i.test(s))return"character";
  if(/(?:female:|Female:|여:|여자:)/.test(s))return"female";
  if(/(?:male:|Male:|남:|남자:)/.test(s))return"male";
  if(/^(?:artist):/i.test(s))return"artist";
  if(/^(?:series):/i.test(s))return"series";
  return"tagprefix";
}
function tagMarkup(t,removable=false){
  const label=tagLabel(t);
  return '<span class="chip '+tagColor(t)+'">'+esc(label)+(removable?' <button type="button" data-trm="'+esc(t)+'">×</button>':'')+'</span>';
}
function typedTagValue(tags,type){
  const prefix=type+':';
  return (tags||[]).filter(t=>tagLabel(t).toLowerCase().startsWith(prefix)).map(t=>tagLabel(t).slice(prefix.length).trim()).filter(Boolean);
}
function infoLine(tags,type,label){
  const values=[...new Set(typedTagValue(tags,type))];
  return values.length?'<div class="main-info-line"><span class="main-info-label">'+label+':</span> '+esc(values.join(', '))+'</div>':'';
}
const pad2=n=>{n=parseInt(n,10);return String(isNaN(n)||n<0?0:n).padStart(2,"0")};
const getDur=()=>pad2($("durH").value)+":"+pad2($("durM").value)+":"+pad2($("durS").value);
function setDur(str){const m=String(str||"00:00:00").match(/^(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  $("durH").value=m?+m[1]:0;$("durM").value=m?+m[2]:0;$("durS").value=m?+m[3]:0}

/* IndexedDB */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,3);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains(SB))d.createObjectStore(SB,{keyPath:"id"});
    if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:"name"});
    if(!d.objectStoreNames.contains(SC))d.createObjectStore(SC,{keyPath:"id"});
  };
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);
})}
const all=n=>new Promise((res,rej)=>{const r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const put=(n,v)=>new Promise((res,rej)=>{const r=db.transaction(n,"readwrite").objectStore(n).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
const del=(n,k)=>new Promise((res,rej)=>{const r=db.transaction(n,"readwrite").objectStore(n).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});

/* 카테고리 헬퍼 */
const getCat=id=>categories.find(c=>c.id===id)||null;
function catPath(id){const p=[];let c=getCat(id);const s=new Set();
  while(c&&!s.has(c.id)){s.add(c.id);p.unshift(c.name);c=c.parentId?getCat(c.parentId):null}return p.join(" / ")}
function displayCatPath(id){const p=[];let c=getCat(id);const s=new Set();
  while(c&&!s.has(c.id)){s.add(c.id);p.unshift(c.name);c=c.parentId?getCat(c.parentId):null}
  return p.length>1?p.slice(1).join(" / "):"";}
function descIds(id){const s=new Set([id]);let ch=1;
  while(ch){ch=0;for(const c of categories)if(c.parentId&&s.has(c.parentId)&&!s.has(c.id)){s.add(c.id);ch=1}}return s}
const children=pid=>categories.filter(c=>(c.parentId||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
const topCats=()=>children(null);
/** 최상위 id 구하기 */ function rootId(id){let c=getCat(id);const s=new Set();
  while(c?.parentId&&!s.has(c.id)){s.add(c.id);c=getCat(c.parentId)}return c?.id||id}
/** 경로 보장 */ async function ensurePath(parts, underTop=null){
  if(!parts?.length)return underTop||null;let pid=underTop;
  for(const raw of parts){const n=raw.trim();if(!n)continue;
    let f=categories.find(c=>c.name===n&&(c.parentId||null)===(pid||null));
    if(!f){f={id:uid(),name:n,parentId:pid||null};await put(SC,f);categories.push(f)}pid=f.id}
  return pid;
}
const resolvePath=(s,under)=>!s?.trim()?under||null:ensurePath(s.split(/[/＞>]/).map(x=>x.trim()).filter(Boolean),under);

/* 로드 */
async function refresh(){
  items=await all(SB);const stRows=await all(ST);registeredTags=stRows.map(t=>t.name);registeredTagMeta=stRows;categories=await all(SC);
  for(const x of items){if(x.category&&!x.categoryId){const id=await resolvePath(x.category,null);if(id){x.categoryId=id;delete x.category;await put(SB,x)}}}
  const used=new Set();items.forEach(x=>{(x.tags||[]).forEach(t=>used.add(t));(x.characters||[]).forEach(ch=>(ch.tags||[]).forEach(t=>used.add(t)))});
  registeredTags.forEach(t=>used.add(t));registeredTags=[...used].sort((a,b)=>a.localeCompare(b,"ko"));
  if(activeTopId&&!getCat(activeTopId))activeTopId=null;
  render();
}

/* 필터: 현재 최상위(+하위) 범위 */
function scopeIds(){return activeTopId?descIds(activeTopId):null}
function getFiltered(){
  const q=$("search").value.trim().toLowerCase(), scope=$("searchScope").value||"all";
  const sub=$("subCatFilter")?.value||"";
  const ids=scopeIds();
  return items.filter(x=>{
    if(ids){if(!x.categoryId||!ids.has(x.categoryId))return false}
    if(sub){const sid=descIds(sub);if(!x.categoryId||!sid.has(x.categoryId))return false}
    if(q){
      let t="";
      if(scope==="title")t=(x.title||"").toLowerCase();
      else if(scope==="tag")t=[...(x.tags||[]),...(x.characters||[]).flatMap(c=>c.tags||[])].join(" ").toLowerCase();
      else if(scope==="char")t=(x.characters||[]).map(c=>[c.name,c.gender,c.count,(c.tags||[]).join(" ")].join(" ")).join(" ").toLowerCase();
      else t=[x.title,x.url,x.notes,x.categoryId?catPath(x.categoryId):"",...(x.tags||[]),
        ...(x.characters||[]).flatMap(c=>[c.name,...(c.tags||[])])].join(" ").toLowerCase();
      if(!t.includes(q))return false;
    }
    const ts=new Set([...(x.tags||[]),...(x.characters||[]).flatMap(c=>c.tags||[])]);
    for(const[tag,st] of Object.entries(tagStates)){
      if(st==="include"&&!ts.has(tag))return false;
      if(st==="exclude"&&ts.has(tag))return false;
    }
    return true;
  });
}

function tagsInScope(){
  const ids=scopeIds(), set=new Set();
  for(const x of items){
    if(ids&&(!x.categoryId||!ids.has(x.categoryId)))continue;
    (x.tags||[]).forEach(t=>set.add(t));(x.characters||[]).forEach(c=>(c.tags||[]).forEach(t=>set.add(t)));
  }
  // 사전등록 태그도 현재 카테고리의 태그만 노출
  const prefix=activeTopId?"["+catPath(activeTopId)+"] ":"";
  for(const t of registeredTags){if(!prefix||t.startsWith(prefix))set.add(t)}
  return [...set].sort((a,b)=>a.localeCompare(b,"ko"));
}
function renderTagGrid(){
  const q=($("tagFilterSearch")?.value||"").trim().toLowerCase(), counts={};

    (x.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1);

function cycleTag(tag){const c=tagStates[tag]||null;if(!c)tagStates[tag]="include";else if(c==="include")tagStates[tag]="exclude";else delete tagStates[tag];render()}

function showCharTagSug(i,q){

async function addCharTag(i,tag,register=true){
  tag=tag.trim();if(!tag)return;const storeName=activeTopId&&!tag.startsWith("[")?("["+catPath(activeTopId)+"] "+tag):tag;
  if(!curChars[i].tags)curChars[i].tags=[];if(!curChars[i].tags.includes(storeName))curChars[i].tags.push(storeName);
  if(register&&!registeredTags.includes(storeName)){const row={name:storeName,kind:/^(?:character|cast):/i.test(tagLabel(storeName))?tagLabel(storeName).match(/^(?:character|cast):/i)[0]:""};await put(ST,row);registeredTags.push(storeName);registeredTagMeta.push(row);registeredTags.sort((a,b)=>a.localeCompare(b,"ko"))}
  for(const st of autoSeriesFromCharacterTags(curChars[i].tags))if(!curTags.includes(st))curTags.push(st);
  renderChars();renderSelTags();

/* character/cast 사전태그에 연결된 series를 자동 적용 */
function autoSeriesFromCharacterTags(charTags){
  const names=new Set((charTags||[]).map(t=>String(t).toLowerCase()));
  const out=[];
  for(const row of registeredTagMeta){
    const n=String(row.name||"");
    if(names.has(n.toLowerCase()) && /^(?:character|cast):$/i.test(String(row.kind||"")) && row.series){
      let series=String(row.series).trim();
      if(!series)continue;
      if(!/^\[/.test(series) && !/^series:/i.test(series))series="series:"+series;
      if(activeTopId&&!series.startsWith("["))series="["+catPath(activeTopId)+"] "+series;
      else if(activeTopId&&series.startsWith("series:"))series="["+catPath(activeTopId)+"] "+series;
      out.push(series);
    }
  }
  return [...new Set(out)];
}

  $("metaPagesField").classList.toggle("hidden",mt!=="pages");$("metaDurationField").classList.toggle("hidden",mt!=="duration");
  renderSelTags();renderSelCat();renderChars();
  $("tagPickerInput").value="";$("catPickerInput").value="";
  $("tagSuggest").classList.remove("open");$("catSuggest").classList.remove("open");
  $("editModal").classList.add("open");
  // 버튼 재바인딩 (캐시/재렌더 대비)
  const ab=$("addCharBtn");
  if(ab)ab.onclick=addOneChar;
}
function renderSelTags(){
  curTags.sort((a,b)=>tagLabel(a).localeCompare(tagLabel(b),"ko"));$("selectedTags").innerHTML=curTags.map(t=>tagMarkup(t,true)).join("");
  $("selectedTags").querySelectorAll("[data-trm]").forEach(b=>b.onclick=()=>{curTags=curTags.filter(t=>t!==b.dataset.trm);renderSelTags()});
}
function renderSelCat(){
  const box=$("selectedCat");
  if(!curCatId){box.innerHTML="";return}
  box.innerHTML='<span class="chip cat">'+esc(catPath(curCatId))+' <button type="button" id="clrCat">×</button></span>';
  $("clrCat").onclick=()=>{curCatId=activeTopId;renderSelCat()};
}
function showTagSug(q){
  const box=$("tagSuggest"),low=q.toLowerCase();
  const cand=tagsInScope().filter(t=>t.toLowerCase().includes(low)&&!curTags.includes(t)).slice(0,12);
  if(!cand.length){box.classList.remove("open");return}
  box.innerHTML=cand.map(t=>'<div data-t="'+esc(t)+'" class="'+tagColor(t)+'">'+esc(tagLabel(t))+'</div>').join("");
  box.classList.add("open");
  box.querySelectorAll("div").forEach(d=>d.onclick=()=>{addTag(d.dataset.t);$("tagPickerInput").value="";box.classList.remove("open")});
}
async function addTag(tag){
  tag=tag.trim();if(!tag)return;const storeName=activeTopId&&!tag.startsWith("[")?("["+catPath(activeTopId)+"] "+tag):tag;
  if(curTags.includes(storeName))return;curTags.push(storeName);
  if(!registeredTags.includes(storeName)){await put(ST,{name:storeName});registeredTags.push(storeName);registeredTags.sort((a,b)=>a.localeCompare(b,"ko"));}renderSelTags();
}
function showCatSug(q){
  const box=$("catSuggest"),low=(q||"").toLowerCase(),ordered=[];
  if(!activeTopId)return;
  const walk=(pid,d)=>{for(const c of children(pid)){const path=catPath(c.id);
    if(!low||path.toLowerCase().includes(low)||c.name.toLowerCase().includes(low))ordered.push({id:c.id,name:c.name,depth:d});
    walk(c.id,d+1)}};
  // 최상위 자신 포함
  ordered.push({id:activeTopId,name:getCat(activeTopId)?.name||"",depth:0});
  walk(activeTopId,1);
  const list=ordered.slice(0,40);
  if(!list.length){box.classList.remove("open");return}
  box.innerHTML=list.map(c=>'<div data-id="'+c.id+'" style="padding-left:'+(8+c.depth*16)+'px">'+esc(c.name)+'</div>').join("");
  box.classList.add("open");
  box.querySelectorAll("[data-id]").forEach(d=>d.onclick=()=>{curCatId=d.dataset.id;renderSelCat();$("catPickerInput").value="";box.classList.remove("open")});
}
$("tagPickerInput").oninput=e=>showTagSug(e.target.value);
$("tagPickerInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=e.target.value.trim();if(v){addTag(v);e.target.value="";$("tagSuggest").classList.remove("open")}}};
$("catPickerInput").oninput=e=>showCatSug(e.target.value);
$("catPickerInput").onfocus=e=>showCatSug(e.target.value);
$("metaType").onchange=()=>{const v=$("metaType").value;$("metaPagesField").classList.toggle("hidden",v!=="pages");$("metaDurationField").classList.toggle("hidden",v!=="duration")};
document.addEventListener("click",e=>{if(!e.target.closest(".picker")){$("tagSuggest").classList.remove("open");$("catSuggest").classList.remove("open")}});

window.editItem=id=>showEdit(items.find(x=>x.id===id));
window.removeItem=async id=>{if(confirm("삭제할까요?")){await del(SB,id);await refresh()}};
$("addBtn").onclick=()=>showEdit();
$("cancelBtn").onclick=()=>$("editModal").classList.remove("open");
$("saveBtn").onclick=async()=>{
  let url=normalizeUrl($("url").value);
  if(!url||!/^https?:\/\//i.test(url)){alert("http(s) URL 필요");return}
  if(!activeTopId){alert("최상위 카테고리를 먼저 선택하세요");return}
  const dup=items.find(x=>normalizeUrl(x.url)===url&&x.id!==editingId);
  if(dup&&!confirm("같은 URL 있음. 저장?"))return;
  // 등장인물 동기화 (input에서 이미 curChars 갱신)
  const chars=curChars.filter(c=>c.name&&c.name.trim()).map(c=>({
    name:c.name.trim(),gender:c.gender||"male",
    count:c.count!=null&&c.count!==""?+c.count:1,tags:[...new Set(c.tags||[])].sort((a,b)=>tagLabel(a).localeCompare(tagLabel(b),"ko"))
  }));
  for(const st of autoSeriesFromCharacterTags(chars.flatMap(c=>c.tags||[])))if(!curTags.includes(st))curTags.push(st);
  const now=Date.now(),old=editingId?items.find(x=>x.id===editingId):null,mt=$("metaType").value||"";
  let categoryId=curCatId||activeTopId;
  // 반드시 현재 최상위 트리 안
  if(!descIds(activeTopId).has(categoryId))categoryId=activeTopId;
  await put(SB,{id:editingId||uid(),url,title:$("title").value.trim()||url,categoryId,
    tags:[...new Set(curTags)].sort((a,b)=>tagLabel(a).localeCompare(tagLabel(b),"ko")),characters:chars,notes:$("notes").value.trim(),metaType:mt,
    pages:mt==="pages"?(parseInt($("metaPages").value,10)||null):null,
    duration:mt==="duration"?getDur():null,createdAt:old?.createdAt||now,updatedAt:now});
  $("editModal").classList.remove("open");await refresh();
};

/* import/export */
$("importBtn").onclick=()=>$("importModal").classList.add("open");
$("importCancel").onclick=()=>$("importModal").classList.remove("open");
$("fileInput").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const n=await importData(await f.text(),f.name);alert(n.added+"개 추가, "+n.duplicates+" 중복");
    $("importModal").classList.remove("open");e.target.value="";await refresh()}catch(err){alert("실패: "+err.message)}
};
async function importData(text,name){
  let data=[];
  if(/\.json$/i.test(name)){const j=JSON.parse(text);data=Array.isArray(j)?j:(j.bookmarks||[]);
    if(j.categories)for(const c of j.categories)if(!getCat(c.id)){await put(SC,c);categories.push(c)}
    if(j.registeredTags)for(const t of j.registeredTags)if(!registeredTags.includes(t)){await put(ST,{name:t});registeredTags.push(t)}
  }else if(/\.html?$/i.test(name))data=parseHTML(text);else data=parseText(text);
  let added=0,dups=0;const now=Date.now(),urls=new Set(items.map(x=>normalizeUrl(x.url)));
  const under=activeTopId||null;
  for(const raw of data){
    if(!raw.url||!/^https?:\/\//i.test(raw.url.trim()))continue;
    const url=normalizeUrl(raw.url);if(urls.has(url)){dups++;continue}urls.add(url);
    const tags=[...new Set((raw.tags||[]).filter(Boolean))];
    for(const t of tags)if(!registeredTags.includes(t)){await put(ST,{name:t});registeredTags.push(t)}
    let categoryId=raw.categoryId||null;
    if(!categoryId&&raw.categoryPath?.length)categoryId=await ensurePath(raw.categoryPath,under);
    else if(!categoryId&&raw.category)categoryId=await resolvePath(raw.category,under);
    else if(!categoryId)categoryId=under;
    const item={id:raw.id||uid(),url,title:raw.title?.trim()||url,categoryId,tags,
      characters:raw.characters||[],notes:raw.notes||"",metaType:raw.metaType||"",
      pages:raw.pages??null,duration:raw.duration??null,createdAt:raw.createdAt||now,updatedAt:now};
    await put(SB,item);items.push(item);added++;
  }
  registeredTags.sort((a,b)=>a.localeCompare(b,"ko"));return{added,duplicates:dups};
}
function parseText(t){const out=[];for(const line of t.split(/\r?\n/)){const m=line.match(/https?:\/\/\S+/i);if(m){
  const url=m[0].replace(/[),.;]+$/,"");out.push({url,title:line.slice(0,m.index).trim()||url,tags:[]})}}return out}
function parseHTML(t){const doc=new DOMParser().parseFromString(t,"text/html"),out=[];
  const walk=(node,path=[])=>{for(const el of node.children||[]){
    if(el.tagName==="DT"){const h=el.querySelector(":scope > H3"),a=el.querySelector(":scope > A");
      if(h)walk(el.querySelector(":scope > DL")||el,path.concat(h.textContent.trim()));
      else if(a)out.push({url:a.getAttribute("HREF")||"",title:a.textContent.trim(),categoryPath:path.length?path:null,tags:[]});
    }else walk(el,path)}};walk(doc.body,[]);return out}
$("exportBtn").onclick=async()=>{
  const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),
    bookmarks:await all(SB),registeredTags:(await all(ST)).map(t=>t.name),categories:await all(SC)},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tagmark-backup.json";a.click();URL.revokeObjectURL(a.href);
};
$("search").oninput=render;$("searchScope").onchange=render;$("sort").onchange=render;
$("subCatFilter").onchange=render;
openDB().then(refresh);
</script>
